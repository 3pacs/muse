<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0DTE Tape Dashboard — Live-G1 Delivery</title>
<style>
:root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
        --ok: #3fb950; --warn: #d29922; --bad: #f85149; --card: #161b22; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif;
       margin: 0; padding: 16px; }
header { display: flex; justify-content: space-between; align-items: baseline;
         flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
h1 { font-size: 1.4rem; margin: 0; }
.badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px;
         background: var(--card); border: 1px solid var(--muted); }
.badge.live { border-color: var(--ok); color: var(--ok); }
.badge.stale { border-color: var(--warn); color: var(--warn); }
.badge.down { border-color: var(--bad); color: var(--bad); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px; margin-bottom: 16px; }
.card { background: var(--card); border-radius: 8px; padding: 12px; }
.card .k { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
.card .v { font-size: 1.5rem; font-weight: 600; margin: 4px 0; }
.card .s { font-size: 0.7rem; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--card); }
th { color: var(--muted); font-weight: 500; }
th:first-child, td:first-child { text-align: left; }
.provenance { font-size: 0.7rem; color: var(--muted); margin-top: 16px;
              border-top: 1px solid var(--card); padding-top: 12px; }
.provenance details { margin: 4px 0; }
.provenance summary { cursor: pointer; }
.unavailable { color: var(--bad); }
a { color: var(--accent); }
:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>0DTE Tape Dashboard</h1>
  <div>
    <span class="badge" id="conn-badge">checking…</span>
    <span class="badge" id="fresh-badge">checking…</span>
  </div>
</header>

<div id="alert" role="alert" style="display:none"></div>

<section aria-label="Key metrics">
<div class="grid" id="metrics"></div>
</section>

<section aria-label="Session ranges">
<h2>Session Ranges</h2>
<div style="overflow-x:auto">
<table id="ranges" aria-label="Intraday ranges">
<thead><tr><th>Time</th><th>Spot</th><th>Max Pain</th><th>Flip</th><th>Pin</th></tr></thead>
<tbody></tbody>
</table>
</div>
</section>

<section class="provenance" aria-label="Data provenance">
<h2>Provenance</h2>
<div id="prov"></div>
<p>Adapter: <code>live-g1/v1</code> · Backend pin: <code>8649ad54</code> ·
UI pin: <code>e5a8a0ce</code> · <a href="#transport">Transport docs</a></p>
</section>

<script>
"use strict";
/* LIVE-G1-DELIVERY: primary dashboard with adapter transport.
   Data embedded at build from authentic adapter captures.
   Transport: window.LIVE_G1.fetchSnapshot() etc. can be pointed at
   a live adapter endpoint for refresh; defaults to embedded. */

const EMBEDDED = __EMBEDDED_JSON__;

const TRANSPORT = {
  base: null, // set to e.g. "http://localhost:8787/adapter/v1" for live
  async get(path) {
    if (!this.base) return null; // use embedded
    const r = await fetch(this.base + path);
    if (!r.ok) throw new Error("transport " + r.status);
    return r.json();
  }
};
window.LIVE_G1 = {
  version: "live-g1/v1",
  transport: TRANSPORT,
  fetchStatus: () => TRANSPORT.get("/status"),
  fetchSnapshot: () => TRANSPORT.get("/snapshot"),
  fetchHistory: (n) => TRANSPORT.get("/history?limit=" + (n || 50)),
};

function fmt(v, d=2) {
  if (v == null) return '<span class="unavailable">unavailable</span>';
  return Number(v).toFixed(d);
}
function fieldRow(label, f) {
  const stale = f.stale ? ' <span class="badge stale">stale</span>' : '';
  const unav = f.unavailable ? ' <span class="badge down">unavailable</span>' : '';
  return `<div class="card" tabindex="0" aria-label="${label}: ${f.value ?? 'unavailable'}">
    <div class="k">${label}${stale}${unav}</div>
    <div class="v">${fmt(f.value)}</div>
    <div class="s">${f.source || ''} · ${f.source_at ? 'as of ' + f.source_at.slice(11,16) + 'Z' : 'clock unknown'}</div>
  </div>`;
}
function render(snapshot, status) {
  const f = snapshot.fields || {};
  const m = document.getElementById('metrics');
  m.innerHTML = [
    fieldRow('Spot', f.spot || {}),
    fieldRow('Max Pain', f.max_pain || {}),
    fieldRow('Gamma Flip', f.gamma_flip || {}),
    fieldRow('Pin Score', {...(f.pin_score||{}), value: f.pin_score?.value}),
    fieldRow('Call Wall', f.call_wall || {}),
    fieldRow('Put Wall', f.put_wall || {}),
  ].join('');

  // Connection + freshness badges
  const cb = document.getElementById('conn-badge');
  const fb = document.getElementById('fresh-badge');
  const interp = status?.backend?.interpreter;
  if (interp && !interp.reachable) {
    cb.textContent = 'disconnected'; cb.className = 'badge down';
  } else { cb.textContent = 'connected'; cb.className = 'badge live'; }
  const v = status?.data_vintage;
  if (v?.stale) {
    fb.textContent = 'stale: ' + (v.stale_reason || 'unknown');
    fb.className = 'badge stale';
  } else { fb.textContent = 'fresh'; fb.className = 'badge live'; }

  // Ranges
  const tb = document.querySelector('#ranges tbody');
  const recs = (window.__HISTORY__ || {}).records || [];
  tb.innerHTML = recs.slice(0, 12).map(r =>
    `<tr><td>${(r.recorded_at||'').slice(11,16)}</td><td>${fmt(r.spot)}</td>` +
    `<td>${fmt(r.max_pain)}</td><td>${fmt(r.gamma_flip)}</td><td>${fmt(r.pin_score,0)}</td></tr>`
  ).join('') || '<tr><td colspan="5">no history available</td></tr>';

  // Provenance
  document.getElementById('prov').innerHTML =
    `<details><summary>Field sources</summary><dl>` +
    Object.entries(f).map(([k, fv]) =>
      `<dt><code>${k}</code></dt><dd>source: ${fv.source||'unknown'}; ` +
      `clock: ${fv.source_at||'unknown'}; received: ${fv.received_at||'unknown'}; ` +
      (fv.oi_vintage ? `OI vintage: ${fv.oi_vintage}; ` : '') +
      `stale: ${fv.stale}; unavailable: ${fv.unavailable}</dd>`
    ).join('') + `</dl></details>` +
    `<details><summary>Transport</summary><p id="transport">Read-only adapter ` +
    `<code>live-g1/v1</code>. UI fetches via <code>window.LIVE_G1</code>; ` +
    `set <code>LIVE_G1.transport.base</code> to a live adapter URL to refresh. ` +
    `Embedded data is a build-time snapshot; the page never invents values.</p></details>`;
}

// Boot from embedded captures
try {
  render(window.__SNAPSHOT__, window.__STATUS__);
} catch (e) {
  document.getElementById('alert').style.display = 'block';
  document.getElementById('alert').textContent = 'Render failed: ' + e.message;
}
</script>
</body>
</html>

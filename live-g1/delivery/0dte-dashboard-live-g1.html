<title>0DTE Tape Dashboard — Live-G1 Delivery</title>
<style>
:root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
        --ok: #3fb950; --warn: #d29922; --bad: #f85149; --card: #161b22; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif;
       margin: 0; padding: 16px; }
header { display: flex; justify-content: space-between; align-items: baseline;
         flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
h1 { font-size: 1.4rem; margin: 0; }
.badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px;
         background: var(--card); border: 1px solid var(--muted); }
.badge.live { border-color: var(--ok); color: var(--ok); }
.badge.stale { border-color: var(--warn); color: var(--warn); }
.badge.down { border-color: var(--bad); color: var(--bad); }
.badge.unknown { border-color: var(--muted); color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px; margin-bottom: 16px; }
.card { background: var(--card); border-radius: 8px; padding: 12px; }
.card .k { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
.card .v { font-size: 1.5rem; font-weight: 600; margin: 4px 0; }
.card .s { font-size: 0.7rem; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--card); }
th { color: var(--muted); font-weight: 500; }
th:first-child, td:first-child { text-align: left; }
.provenance { font-size: 0.7rem; color: var(--muted); margin-top: 16px;
              border-top: 1px solid var(--card); padding-top: 12px; }
.provenance details { margin: 4px 0; }
.provenance summary { cursor: pointer; }
.unavailable { color: var(--bad); }
#refresh-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px;
               font-size: 0.8rem; }
#refresh-bar button { background: var(--card); color: var(--fg);
                      border: 1px solid var(--muted); border-radius: 6px;
                      padding: 4px 12px; cursor: pointer; }
#refresh-bar button:disabled { opacity: 0.5; cursor: default; }
a { color: var(--accent); }
:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }
</style>
</head>

<script>
"use strict";
/* LIVE-G1-DELIVERY-R1: primary dashboard with adapter transport.
   Boot order: data inject (above) runs before this script.
   If data is missing, UI shows honest unknown/unavailable states. */

const TRANSPORT = {
  base: null, // set to e.g. "http://localhost:8787/adapter/v1" for live
  async get(path) {
    if (!this.base) return null; // use embedded
    const r = await fetch(this.base + path);
    if (!r.ok) throw new Error("transport " + r.status);
    return r.json();
  }
};

const LIVE_G1 = {
  version: "live-g1/v1",
  transport: TRANSPORT,
  lastError: null,
  async refresh() {
    const btn = document.getElementById('refresh-btn');
    const note = document.getElementById('refresh-note');
    if (!TRANSPORT.base) {
      note.textContent = 'No transport configured — showing embedded snapshot.';
      return;
    }
    btn.disabled = true;
    note.textContent = 'Refreshing…';
    try {
      const [status, snapshot, history] = await Promise.all([
        TRANSPORT.get('/status'), TRANSPORT.get('/snapshot'),
        TRANSPORT.get('/history?limit=20'),
      ]);
      // Compare snapshot identity: only replace if newer or different
      const oldTs = (window.__SNAPSHOT__ || {}).snapshot_at;
      const newTs = (snapshot || {}).snapshot_at;
      if (newTs && oldTs && newTs <= oldTs) {
        note.textContent = 'No newer data — kept last good snapshot.';
      } else {
        window.__STATUS__ = status; window.__SNAPSHOT__ = snapshot;
        window.__HISTORY__ = history;
        note.textContent = 'Refreshed from transport at ' + new Date().toISOString().slice(11,19) + 'Z.';
      }
      LIVE_G1.lastError = null;
      render(window.__SNAPSHOT__, window.__STATUS__);
    } catch (e) {
      LIVE_G1.lastError = String(e && e.message || e);
      note.textContent = 'Refresh failed: ' + LIVE_G1.lastError + ' — kept last good data.';
      // Re-render to show honest error/stale state
      render(window.__SNAPSHOT__, window.__STATUS__);
    } finally {
      btn.disabled = false;
    }
  }
};
window.LIVE_G1 = LIVE_G1;
document.getElementById('refresh-btn').addEventListener('click', () => LIVE_G1.refresh());

function fmt(v, d=2) {
  if (v == null) return '<span class="unavailable">unavailable</span>';
  const n = Number(v);
  if (!isFinite(n)) return '<span class="unavailable">unavailable</span>';
  return n.toFixed(d);
}
function fieldRow(label, f) {
  f = f || {};
  const stale = f.stale ? ' <span class="badge stale">stale</span>' : '';
  const unav = f.unavailable ? ' <span class="badge down">unavailable</span>' : '';
  return `<div class="card" tabindex="0" aria-label="${label}: ${f.value ?? 'unavailable'}">
    <div class="k">${label}${stale}${unav}</div>
    <div class="v">${fmt(f.value)}</div>
    <div class="s">${f.source || 'source unknown'} · ${f.source_at ? 'as of ' + String(f.source_at).slice(11,16) + 'Z' : 'clock unknown'}</div>
  </div>`;
}
function render(snapshot, status) {
  // Honest missing-data path: never throw, never invent.
  const hasData = snapshot && typeof snapshot === 'object' && snapshot.fields;
  const f = hasData ? snapshot.fields : {};
  const m = document.getElementById('metrics');
  if (!hasData) {
    m.innerHTML = '<div class="card"><div class="k">No snapshot data</div>' +
      '<div class="v"><span class="unavailable">unavailable</span></div>' +
      '<div class="s">Embedded snapshot missing or corrupt.</div></div>';
  } else {
    m.innerHTML = [
      fieldRow('Spot', f.spot),
      fieldRow('Max Pain', f.max_pain),
      fieldRow('Gamma Flip', f.gamma_flip),
      fieldRow('Pin Score', f.pin_score),
      fieldRow('Call Wall', f.call_wall),
      fieldRow('Put Wall', f.put_wall),
    ].join('');
  }

  // Connection + freshness: unknown when status missing, never false-fresh.
  const cb = document.getElementById('conn-badge');
  const fb = document.getElementById('fresh-badge');
  if (!status || typeof status !== 'object') {
    cb.textContent = 'unknown'; cb.className = 'badge unknown';
    fb.textContent = 'unknown'; fb.className = 'badge unknown';
  } else {
    const interp = status.backend && status.backend.interpreter;
    if (interp && interp.reachable === false) {
      cb.textContent = 'disconnected'; cb.className = 'badge down';
    } else if (interp && interp.reachable === true) {
      cb.textContent = 'connected'; cb.className = 'badge live';
    } else {
      cb.textContent = 'unknown'; cb.className = 'badge unknown';
    }
    const v = status.data_vintage;
    if (v && v.stale) {
      fb.textContent = 'stale: ' + (v.stale_reason || 'unknown');
      fb.className = 'badge stale';
    } else if (v && v.stale === false) {
      fb.textContent = 'fresh'; fb.className = 'badge live';
    } else {
      fb.textContent = 'unknown'; fb.className = 'badge unknown';
    }
  }

  // Transport error surfaced honestly
  if (LIVE_G1.lastError) {
    const a = document.getElementById('alert');
    a.style.display = 'block';
    a.innerHTML = 'Transport error: <code>' + LIVE_G1.lastError.replace(/</g,'&lt;') +
      '</code> — showing last good data.';
  } else {
    document.getElementById('alert').style.display = 'none';
  }

  // Ranges
  const tb = document.querySelector('#ranges tbody');
  const recs = (window.__HISTORY__ && window.__HISTORY__.records) || [];
  tb.innerHTML = recs.slice(0, 12).map(r =>
    `<tr><td>${String(r.recorded_at||'').slice(11,16)}</td><td>${fmt(r.spot)}</td>` +
    `<td>${fmt(r.max_pain)}</td><td>${fmt(r.gamma_flip)}</td><td>${fmt(r.pin_score,0)}</td></tr>`
  ).join('') || '<tr><td colspan="5">no history available</td></tr>';

  // Provenance
  const prov = document.getElementById('prov');
  if (hasData) {
    prov.innerHTML =
      `<details><summary>Field sources</summary><dl>` +
      Object.entries(f).map(([k, fv]) => {
        fv = fv || {};
        return `<dt><code>${k}</code></dt><dd>source: ${fv.source||'unknown'}; ` +
        `clock: ${fv.source_at||'unknown'}; received: ${fv.received_at||'unknown'}; ` +
        (fv.oi_vintage ? `OI vintage: ${fv.oi_vintage}; ` : '') +
        `stale: ${fv.stale===true}; unavailable: ${fv.unavailable===true}</dd>`;
      }).join('') + `</dl></details>` +
      `<details><summary>Transport</summary><p>Read-only adapter <code>live-g1/v1</code>. ` +
      `UI fetches via <code>window.LIVE_G1.refresh()</code>; set ` +
      `<code>LIVE_G1.transport.base</code> to a live adapter URL to refresh. ` +
      `Embedded data is a build-time snapshot; the page never invents values.</p></details>`;
  } else {
    prov.innerHTML = '<p>No provenance: snapshot missing.</p>';
  }
}

// Boot: data inject runs first; render whatever we have, honestly.
render(window.__SNAPSHOT__, window.__STATUS__);
</script>
</body>
</html>
